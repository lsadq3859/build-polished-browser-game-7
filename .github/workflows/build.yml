name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          find . -path ./out -prune -o -type f -name "*.apk" -path "*outputs/apk*" -print -exec cp {} out/ \;
          ls -la out
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-polished-browser-game7-apk
          path: out/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: build-polished-browser-game (7) - build ${{ github.run_number }}
          files: out/*.apk
